<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Bloqueada</title>
    <style>
      :root {
        --bg: #0f172a;
        --text: #94a3b8;
        --accent: #3b82f6;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8fafc;
          --text: #475569;
          --accent: #2563eb;
        }
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .container {
        text-align: center;
        max-width: 480px;
      }

      .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      p {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: var(--text);
      }

      .highlight {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🛡️</div>
      <p>
        Esta página <span class="highlight">não está disponível</span> enquanto
        o agente está ativo<br />por questões de segurança.
      </p>
    </div>
  </body>
</html>
